<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="./src/images/mn_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mah Notes</title>
    <meta name="theme-color" content="#ec3013">
    <!--CSP-->
    <!-- Icons (Font Awesome) and the typeface (Archivo, 400 body / 600 titles /
         800 display) are imported in src/main.tsx so they are bundled. They used
         to load from jsDelivr and Google Fonts, which meant the APK and the
         desktop app fetched executable CSS from a third party on every launch. -->
    <!-- Runs before first paint. A file, not an inline script, so the Content
         Security Policy above can forbid inline script outright. No defer/async:
         it must finish before anything renders or the theme flashes. -->
    <script src="./theme-boot.js"></script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
