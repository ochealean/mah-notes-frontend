# ============================================================
#  Build the Windows desktop app and attach it to the SAME GitHub
#  Release the APK goes to, so one tag ships every platform and the
#  in-app updater finds the right asset by extension.
#
#  Runs beside release.yml on the same `v*` tag. Two workflows rather
#  than one job matrix, because the Android build needs a JDK and a
#  keystore while this one needs Rust and a Windows runner, and mixing
#  them makes both slower and harder to read.
#
#  It can also be run by hand from the Actions tab. That build uploads
#  the installer as a workflow artifact and creates no release, so the
#  desktop app can be tested on a real machine before a version is cut.
#  It is also the way to get an installer at all on a machine where
#  Smart App Control blocks Cargo from running its own build scripts.
# ============================================================
name: Release desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to attach to the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # Rust builds are slow from cold. Keyed on the lockfile so a dependency
      # change invalidates it and nothing else does.
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm ci

      # Refuse to cut a release on a tree with a known high-severity
      # advisory. --omit=dev because build tooling does not ship to users;
      # Dependabot raises those separately.
      - name: Check dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      # .env is gitignored, so CI has none and the app would fall back to
      # localhost. These are all PUBLIC values, already shipped in the web app.
      # VITE_PUBLIC_WEB_BASE matters especially here: without it, share links
      # created on desktop would point at http://tauri.localhost.
      - name: Write .env
        shell: bash
        run: |
          cat > .env <<EOF
          VITE_API_BASE=https://mah-notes-backend.onrender.com
          VITE_GOOGLE_CLIENT_ID=982037934424-cfvsb73fo771e6u4citndjke8mblrqp5.apps.googleusercontent.com
          VITE_PUBLIC_WEB_BASE=https://mah-notes.vercel.app
          EOF

      # The signing key is what lets an installed app trust an update. Tauri
      # verifies every downloaded build against the PUBLIC key in
      # tauri.conf.json, so without these the build produces no signature and
      # no existing install would accept it.
      - name: Build the desktop app
        run: npm run desktop:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # The manifest the installed app polls. It has to name the exact download
      # and carry the signature Tauri produced beside the bundle.
      #
      # The endpoint in tauri.conf.json points at releases/latest/download, so
      # this file is looked up on whichever release is newest — no republishing
      # an endpoint per version.
      - name: Build the update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE=src-tauri/target/release/bundle/nsis
          ZIP=$(ls "$BUNDLE"/*-setup.nsis.zip)
          SIG=$(cat "$ZIP.sig")
          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIG",
                "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$ZIP")"
              }
            }
          }
          EOF
          echo "manifest for $VERSION:"; cat latest.json

      # tauri build writes both an NSIS installer and an MSI.
      #
      # Every run keeps them as a downloadable artifact, tag or not. That is
      # what makes a manual run useful: an installer to try, with no release
      # created and nothing published.
      - name: Keep the installers as an artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mah-notes-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi

      # Only a tag publishes. Both files are attached; the website offers the
      # NSIS one because it installs per-user without a UAC prompt.
      - name: Attach the installers to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.nsis.zip
            src-tauri/target/release/bundle/nsis/*-setup.nsis.zip.sig
            latest.json
          fail_on_unmatched_files: true
