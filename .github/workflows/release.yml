# ============================================================
#  Build a signed Android APK and publish it as a GitHub Release.
#  Triggered by pushing a version tag, e.g.  git tag v1.2.2 && git push origin v1.2.2
#  The installed app reads the latest release tag and offers the update.
#
#  Required repository secrets (Settings → Secrets and variables → Actions):
#    ANDROID_KEYSTORE_BASE64   base64 of android/mahnotes-release.keystore
#    ANDROID_KEYSTORE_PASSWORD  the store password
#    ANDROID_KEY_ALIAS          the key alias (e.g. mahnotes)
#    ANDROID_KEY_PASSWORD       the key password
# ============================================================
name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # Refuse to cut a release on a tree with a known high-severity
      # advisory. --omit=dev because build tooling does not ship to users;
      # Dependabot raises those separately.
      - name: Check dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      # The .env is gitignored, so CI has no env vars → the app would fall back
      # to http://localhost:3000 and fail (cleartext/localhost). These are all
      # PUBLIC values (already shipped in the web app), so we write them here.
      # Move to repo Variables if you prefer not to hardcode them.
      - name: Write frontend .env
        run: |
          cat > .env <<EOF
          VITE_API_BASE=https://mah-notes-backend.onrender.com
          VITE_GOOGLE_CLIENT_ID=982037934424-cfvsb73fo771e6u4citndjke8mblrqp5.apps.googleusercontent.com
          VITE_PUBLIC_WEB_BASE=https://mah-notes.vercel.app
          EOF

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor → Android
        run: npx cap sync android

      - name: Restore signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/mahnotes-release.keystore

      - name: Write keystore.properties
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=../mahnotes-release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        run: |
          chmod +x android/gradlew
          (cd android && ./gradlew assembleRelease --warning-mode none)

      - name: Rename APK with version
        run: cp android/app/build/outputs/apk/release/app-release.apk "mah-notes-${{ github.ref_name }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ github.ref_name }}
          files: mah-notes-${{ github.ref_name }}.apk
          generate_release_notes: true
